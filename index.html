<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PlanPoker — бесплатный покер планирования для команд: оценка задач в story points без регистрации, по одной ссылке."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlanPoker" />
    <meta property="og:title" content="PlanPoker — оценка задач командой" />
    <meta property="og:description" content="Создайте комнату, отправьте ссылку команде и оценивайте задачи вместе." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PlanPoker — оценка задач командой</title>
    <script>
      // Тему ставим до первой отрисовки, чтобы страница не мигала светлой
      try {
        var theme = localStorage.getItem('planpoker:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
