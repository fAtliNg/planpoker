# PlanPoker — покер планирования: https://planpoker.denisenkosergey.ru
# Статика Vite в /var/www/planpoker, WebSocket /ws — на сервер комнат (systemd planpoker, порт 8787).
# Сертификат и редирект на HTTPS добавляет certbot --nginx.
server {
    server_name planpoker.denisenkosergey.ru;

    root /var/www/planpoker;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Сервер пингует клиентов каждые 30 секунд, поэтому таймаут с запасом
        proxy_read_timeout 120s;
    }

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }

    # Маршруты React Router (/r/<комната>) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/planpoker.denisenkosergey.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/planpoker.denisenkosergey.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = planpoker.denisenkosergey.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name planpoker.denisenkosergey.ru;
    return 404; # managed by Certbot


}